[project]
name = "workshop-foc-2026"
version = "0.1.0"
description = "Workshop: Future of Construction 26"
readme = "README.md"
requires-python = "~=3.14.0"
dynamic = ["dependencies"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "rhino-stubs",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.uv]
package = false

[tool.ruff]
line-length = 179

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true
